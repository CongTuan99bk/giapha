name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coinguon
          POSTGRES_PASSWORD: coinguon
          POSTGRES_DB: coinguon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coinguon"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://coinguon:coinguon@localhost:5432/coinguon_test
      TEST_DATABASE_URL: postgresql://coinguon:coinguon@localhost:5432/coinguon_test
      TEST_APP_DATABASE_URL: postgresql://coinguon_app:coinguon_app@localhost:5432/coinguon_test
      TEST_PLATFORM_DATABASE_URL: postgresql://coinguon_platform:coinguon_platform@localhost:5432/coinguon_test
      TEST_API_DATABASE_URL: postgresql://coinguon:coinguon@localhost:5432/coinguon_test_api
      TEST_API_APP_DATABASE_URL: postgresql://coinguon_app:coinguon_app@localhost:5432/coinguon_test_api
      TEST_API_PLATFORM_DATABASE_URL: postgresql://coinguon_platform:coinguon_platform@localhost:5432/coinguon_test_api
      SHADOW_DATABASE_URL: postgresql://coinguon:coinguon@localhost:5432/coinguon_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Kiểm tra giấy phép thư viện (mọi gói production, kể cả gián tiếp)
        run: node scripts/check-licenses.mjs

      - name: Kiểm tra lỗ hổng thư viện
        run: pnpm audit --prod --audit-level high

      - name: Schema Prisma hợp lệ
        run: pnpm --filter @coinguon/db prisma:validate

      - name: Chạy migration + tạo role
        run: |
          pnpm --filter @coinguon/db migrate:deploy
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/docker/postgres/init.sql

      - name: Database riêng cho test API
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE coinguon_test_api"
          DATABASE_URL="$TEST_API_DATABASE_URL" pnpm --filter @coinguon/db migrate:deploy
          psql "$TEST_API_DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/docker/postgres/init.sql

      - name: Database cho test giao diện (e2e) — chạy bằng migrate.mjs, kiểm tra Prisma công nhận
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE coinguon_e2e"
          export E2E_URL=postgresql://coinguon:coinguon@localhost:5432/coinguon_e2e
          DATABASE_URL=$E2E_URL pnpm --filter @coinguon/db migrate
          DATABASE_URL=$E2E_URL pnpm --filter @coinguon/db migrate   # chạy lại: không làm gì
          # migrate.mjs ghi _prisma_migrations y hệt Prisma → prisma migrate status phải báo "up to date"
          DATABASE_URL=$E2E_URL pnpm --filter @coinguon/db exec prisma migrate status
          psql $E2E_URL -v ON_ERROR_STOP=1 -f infra/docker/postgres/init.sql

      - name: Migration SQL khớp schema.prisma
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE coinguon_shadow"
          pnpm --filter @coinguon/db check-drift

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      - name: Cài Chromium cho Playwright
        run: pnpm --filter @coinguon/web exec playwright install --with-deps chromium

      - name: Test giao diện trên trình duyệt (Playwright)
        run: pnpm --filter @coinguon/web test:e2e

      - name: In ảnh chụp trạng thái trang khi lỗi
        if: failure()
        run: find apps/web/test-results -name error-context.md -exec sh -c 'echo "=== $1"; cat "$1"' _ {} \; || true

      - name: Lưu báo cáo Playwright khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Build image Docker và chạy thử toàn bộ hệ thống như trên máy chủ (không có tunnel)
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tạo file cấu hình thử
        run: |
          cat > .env.ci <<EOF
          DB_PASSWORD=$(openssl rand -hex 16)
          APP_DB_PASSWORD=$(openssl rand -hex 16)
          PLATFORM_DB_PASSWORD=$(openssl rand -hex 16)
          COOKIE_SECURE=true
          SEED_PASSWORD=ci-demo-123
          EOF
      - name: Build và khởi động
        run: |
          docker compose -f infra/docker/compose.prod.yml --env-file .env.ci up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/v1/health && exit 0
            sleep 5
          done
          echo "Hệ thống không lên sau 5 phút"; exit 1
      - name: Kiểm tra qua web (Next chuyển tiếp sang API)
        run: |
          set -e
          curl -fsS http://localhost:3000/api/v1/health
          curl -fsS http://localhost:3000/dang-nhap > /dev/null
          curl -fsS http://localhost:3000/api/v1/instance | grep '"clan":null'
          docker compose -f infra/docker/compose.prod.yml --env-file .env.ci run --rm -e SEED_PASSWORD=ci-demo-123 api node dist/seed.js
          curl -fsS http://localhost:3000/api/v1/instance | grep 'ho-phan-mau'
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000/api/v1/auth/login -H 'content-type: application/json' -d '{"email":"quanly@giapha.test","password":"ci-demo-123"}')
          test "$code" = "200"
      - name: Migration chạy lại không lỗi, sao lưu tạo file
        run: |
          set -e
          docker compose -f infra/docker/compose.prod.yml --env-file .env.ci run --rm migrate
          docker compose -f infra/docker/compose.prod.yml --env-file .env.ci exec -T backup /bin/sh /backup.sh now
          ls -la backups
          ls backups/db_*.dump backups/media_*.tar.gz
      - name: Nhật ký khi lỗi
        if: failure()
        run: docker compose -f infra/docker/compose.prod.yml --env-file .env.ci logs --no-color --tail 200
