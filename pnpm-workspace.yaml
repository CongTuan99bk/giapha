packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"

# Vá lỗ hổng phụ thuộc gián tiếp (CI chạy pnpm audit --audit-level high):
# Prisma 6.19 kéo deepmerge-ts 7.x (GHSA-ggr8-5vv4-36mx); Prisma 7 đã dùng 8.0.2 cùng API.
# ExcelJS 4.4 kéo uuid 8 (GHSA-w5hq-g745-h8pq, mức trung bình); uuid 11 vẫn có bản CommonJS cùng API v4.
overrides:
  deepmerge-ts: "^8.0.2"
  exceljs>uuid: "^11.1.1"
  # unzipper 0.10 kéo gói "buffers" không ghi giấy phép; 0.12 bỏ hẳn phụ thuộc đó (ExcelJS đọc file qua JSZip)
  exceljs>unzipper: "^0.12.3"
