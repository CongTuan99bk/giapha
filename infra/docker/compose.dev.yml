# Môi trường phát triển: PostgreSQL, Redis, MinIO (thay Cloudflare R2), Mailpit (hộp thư giả)
# Chạy: pnpm dev:infra   ·   Dừng: pnpm dev:infra:down
name: coinguon-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coinguon
      POSTGRES_PASSWORD: coinguon
      POSTGRES_DB: coinguon
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinguon"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # AOF để không mất bộ đếm thống kê khi khởi động lại (KI-003)
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: coinguon
      MINIO_ROOT_PASSWORD: coinguon-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # giao diện xem thư

volumes:
  pgdata:
  redisdata:
  miniodata:
